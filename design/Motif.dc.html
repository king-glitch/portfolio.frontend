<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project motif</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; min-height: 100%; background: {{bg}}; color: {{tone}}; font-family: Inter, system-ui, sans-serif; overflow: hidden; position: relative">
<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" style="display: block; width: 100%; height: 100%" aria-hidden="true">

<sc-if value="{{is.radar}}" hint-placeholder-val="{{ true }}">
<g fill="none" stroke="currentColor" stroke-width="1" style="opacity: 0.4">
<circle cx="200" cy="150" r="30"></circle>
<circle cx="200" cy="150" r="60"></circle>
<circle cx="200" cy="150" r="90"></circle>
<circle cx="200" cy="150" r="120"></circle>
<circle cx="200" cy="150" r="150" stroke-dasharray="2 6"></circle>
<line x1="40" y1="150" x2="360" y2="150"></line>
<line x1="200" y1="10" x2="200" y2="290"></line>
<line x1="115" y1="65" x2="285" y2="235" stroke-dasharray="2 6"></line>
<line x1="285" y1="65" x2="115" y2="235" stroke-dasharray="2 6"></line>
</g>
<g class="m-spin">
<path d="M200 150 L200 30 A120 120 0 0 1 284.85 65.15 Z" fill="currentColor" style="opacity: 0.16"></path>
<line x1="200" y1="150" x2="200" y2="30" stroke="currentColor" stroke-width="1.5"></line>
</g>
<g fill="currentColor">
<circle class="m-blink" cx="248" cy="96" r="3.5"></circle>
<circle cx="150" cy="198" r="3"></circle>
<circle class="m-blink" cx="276" cy="190" r="3"></circle>
<circle cx="132" cy="112" r="2.5"></circle>
</g>
<g fill="none" stroke="currentColor" stroke-width="1.2">
<rect x="240" y="88" width="16" height="16"></rect>
<line x1="256" y1="88" x2="272" y2="72"></line>
<path d="M276 180 L286 190 L276 200 L266 190 Z"></path>
</g>
<g fill="currentColor" style="font-size: 8px; letter-spacing: 0.08em; opacity: 0.8">
<text x="276" y="70">TRK 041 · SUSPECT</text>
<text x="160" y="214">TRK 017 · FRIEND</text>
<text x="18" y="24">TRML / DR127ADV</text>
<text x="18" y="284">RANGE 150 NM</text>
</g>
</sc-if>

<sc-if value="{{is.moon}}" hint-placeholder-val="{{ false }}">
<g class="m-float">
<circle cx="200" cy="120" r="88" fill="none" stroke="currentColor" stroke-width="1" style="opacity: 0.4"></circle>
<path d="M200 32 A88 88 0 1 1 200 208 A58 88 0 1 0 200 32 Z" fill="currentColor"></path>
</g>
<g stroke="currentColor" stroke-width="1" fill="none">
<line x1="20" y1="236" x2="380" y2="236" style="opacity: 0.6"></line>
<line x1="20" y1="252" x2="380" y2="252" stroke-dasharray="10 6" style="opacity: 0.45"></line>
<line x1="20" y1="268" x2="380" y2="268" stroke-dasharray="6 8" style="opacity: 0.35"></line>
<line x1="20" y1="284" x2="380" y2="284" stroke-dasharray="3 9" style="opacity: 0.25"></line>
</g>
<sc-for list="{{sprouts}}" as="sp" hint-placeholder-count="8">
<g stroke="currentColor" stroke-width="1.2" fill="none">
<line x1="{{sp.x}}" y1="236" x2="{{sp.x}}" y2="{{sp.top}}"></line>
<path d="{{sp.leaf}}"></path>
</g>
</sc-for>
<g fill="currentColor" style="opacity: 0.6">
<circle class="m-blink" cx="70" cy="60" r="1.6"></circle>
<circle cx="330" cy="48" r="1.6"></circle>
<circle class="m-blink" cx="348" cy="120" r="1.2"></circle>
<circle cx="54" cy="150" r="1.2"></circle>
</g>
</sc-if>

<sc-if value="{{is.pixel}}" hint-placeholder-val="{{ false }}">
<rect x="140" y="22" width="120" height="256" rx="20" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
<rect x="182" y="30" width="36" height="6" rx="3" fill="currentColor" style="opacity: 0.6"></rect>
<sc-for list="{{pixels}}" as="px" hint-placeholder-count="40">
<rect x="{{px.x}}" y="{{px.y}}" width="10" height="10" fill="currentColor" class="{{px.cls}}" style="opacity: {{px.op}}"></rect>
</sc-for>
<g stroke="currentColor" stroke-width="1" style="opacity: 0.35">
<line x1="40" y1="60" x2="120" y2="60"></line>
<line x1="40" y1="74" x2="100" y2="74"></line>
<line x1="280" y1="226" x2="360" y2="226"></line>
<line x1="300" y1="240" x2="360" y2="240"></line>
</g>
</sc-if>

<sc-if value="{{is.hex}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{hexes}}" as="hx" hint-placeholder-count="40">
<polygon points="{{hx.pts}}" fill="{{hx.fill}}" stroke="currentColor" stroke-width="1" class="{{hx.cls}}" style="opacity: {{hx.op}}"></polygon>
</sc-for>
<g fill="none" stroke="currentColor" stroke-width="1.5">
<circle cx="200" cy="150" r="46" stroke-dasharray="4 4" class="m-spin-slow"></circle>
<path d="M186 136 L214 136 L222 150 L214 164 L186 164 L178 150 Z"></path>
<circle cx="200" cy="150" r="4" fill="currentColor"></circle>
</g>
</sc-if>

<sc-if value="{{is.orbit}}" hint-placeholder-val="{{ false }}">
<g fill="none" stroke="currentColor" stroke-width="1">
<ellipse cx="200" cy="150" rx="170" ry="54" transform="rotate(-18 200 150)" style="opacity: 0.45"></ellipse>
<ellipse cx="200" cy="150" rx="120" ry="92" transform="rotate(24 200 150)" style="opacity: 0.35"></ellipse>
<circle cx="200" cy="150" r="70" stroke-dasharray="2 5" style="opacity: 0.5"></circle>
</g>
<circle cx="200" cy="150" r="28" fill="currentColor"></circle>
<g class="m-spin-slow">
<circle cx="270" cy="150" r="5" fill="currentColor"></circle>
<circle cx="130" cy="150" r="3" fill="currentColor"></circle>
</g>
<g class="m-spin-rev">
<circle cx="200" cy="58" r="4" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
<circle cx="200" cy="242" r="2.5" fill="currentColor"></circle>
</g>
<g fill="currentColor" style="font-size: 8px; letter-spacing: 0.1em; opacity: 0.75">
<text x="18" y="24">MOON POWER +120 XP</text>
<text x="300" y="284">QUEST 07/12</text>
</g>
</sc-if>

<sc-if value="{{is.pins}}" hint-placeholder-val="{{ false }}">
<g fill="none" stroke="currentColor" stroke-width="1" style="opacity: 0.22">
<path d="M-10 80 C 80 40, 150 120, 240 70 S 380 60, 420 100"></path>
<path d="M-10 140 C 70 110, 160 190, 250 130 S 380 120, 420 160"></path>
<path d="M-10 210 C 90 170, 170 250, 260 200 S 380 190, 420 230"></path>
<line x1="0" y1="186" x2="400" y2="120"></line>
<line x1="140" y1="0" x2="190" y2="300"></line>
</g>
<sc-for list="{{pins}}" as="pn" hint-placeholder-count="60">
<circle cx="{{pn.x}}" cy="{{pn.y}}" r="{{pn.r}}" fill="currentColor" style="opacity: {{pn.op}}"></circle>
</sc-for>
<g fill="currentColor">
<path d="M248 112 C 248 98, 268 98, 268 112 C 268 122, 258 130, 258 138 C 258 130, 248 122, 248 112 Z"></path>
<path class="m-blink" d="M118 168 C 118 156, 134 156, 134 168 C 134 176, 126 182, 126 188 C 126 182, 118 176, 118 168 Z"></path>
</g>
<circle cx="258" cy="140" r="34" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4" class="m-spin-slow"></circle>
<g fill="currentColor" style="font-size: 8px; letter-spacing: 0.1em; opacity: 0.75">
<text x="18" y="24">4,000+ PINS</text>
<text x="18" y="284">CLIMATE RISK · LOW</text>
</g>
</sc-if>

</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["radar","moon","pixel","hex","orbit","pins"],"default":"radar"},"tone":{"editor":"color","default":"#fafafa"},"bg":{"editor":"color","default":"#171717"},"$preview":{"width":400,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'radar';
    let seed = 11;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const is = { radar: kind === 'radar', moon: kind === 'moon', pixel: kind === 'pixel', hex: kind === 'hex', orbit: kind === 'orbit', pins: kind === 'pins' };

    const sprouts = [];
    for (let i = 0; i < 9; i++) {
      const x = 40 + i * 40;
      const top = 236 - (10 + Math.round(rnd() * 14));
      sprouts.push({ x: x, top: top, leaf: 'M' + x + ' ' + (top + 4) + ' C ' + (x + 6) + ' ' + (top - 2) + ', ' + (x + 12) + ' ' + top + ', ' + (x + 12) + ' ' + (top + 6) });
    }

    const pixels = [];
    if (is.pixel) {
      const cols = 9, rows = 19;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const v = rnd();
        const dens = Math.pow(r / rows, 1.6) * 0.95;
        const sun = Math.hypot(c - 6, r - 3) < 1.8;
        if (v < dens || sun) {
          pixels.push({ x: 152 + c * 11 - 2, y: 46 + r * 11, op: sun ? 1 : (0.25 + v * 0.75).toFixed(2), cls: v > 0.92 ? 'm-blink' : '' });
        }
      }
    }

    const hexes = [];
    if (is.hex) {
      const R = 22, w = Math.sqrt(3) * R;
      for (let row = 0; row < 10; row++) for (let col = 0; col < 12; col++) {
        const cx = col * w + (row % 2 ? w / 2 : 0) - 10;
        const cy = row * R * 1.5 - 6;
        const pts = [];
        for (let k = 0; k < 6; k++) {
          const a = Math.PI / 180 * (60 * k - 30);
          pts.push((cx + R * 0.9 * Math.cos(a)).toFixed(1) + ',' + (cy + R * 0.9 * Math.sin(a)).toFixed(1));
        }
        const v = rnd();
        hexes.push({ pts: pts.join(' '), fill: v < 0.1 ? 'currentColor' : 'none', op: v < 0.1 ? 0.85 : (v < 0.55 ? 0.4 : 0.16), cls: v > 0.93 ? 'm-blink' : '' });
      }
    }

    const pins = [];
    if (is.pins) {
      const centers = [[258, 138], [126, 176], [320, 220], [80, 70]];
      for (let i = 0; i < 340; i++) {
        const c = centers[i % centers.length];
        const spread = i % 5 === 0 ? 200 : 70;
        const x = c[0] + ((rnd() + rnd() + rnd()) / 3 - 0.5) * spread * 2;
        const y = c[1] + ((rnd() + rnd() + rnd()) / 3 - 0.5) * spread * 1.4;
        pins.push({ x: x.toFixed(1), y: y.toFixed(1), r: (0.8 + rnd() * 1.2).toFixed(2), op: (0.25 + rnd() * 0.6).toFixed(2) });
      }
    }

    return {
      is: is,
      sprouts: sprouts, pixels: pixels, hexes: hexes, pins: pins,
      tone: this.props.tone ?? '#fafafa',
      bg: this.props.bg ?? '#171717'
    };
  }
}
</script>
</body>
</html>
